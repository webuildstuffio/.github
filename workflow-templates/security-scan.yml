# Version: security-scan-reusable @ 660e4d50f013090d88cd994d971e0d31e53c599e
name: security-scan
'on':
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:

# Superseded runs cancel. Caller concurrency is safe
# since repo-review#238 (reusable inner group renamed
# `security-scan-inner-...`, so it can never equal this
# group; equal strings previously cancelled the whole
# run instantly, ~2s, zero jobs). Keyed by ref, so PR
# runs never cancel the weekly deep scan. Pin below.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    uses: webuildstuffio/repo-review/.github/workflows/security-scan-reusable.yml@660e4d50f013090d88cd994d971e0d31e53c599e # yamllint disable-line rule:line-length
    secrets: inherit

  deep:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    uses: webuildstuffio/repo-review/.github/workflows/security-scan-reusable.yml@660e4d50f013090d88cd994d971e0d31e53c599e # yamllint disable-line rule:line-length
    with:
      deep: true
    secrets: inherit
