# Master Label Configuration v4.1
# Fleet Issue Label Schema v3 - canonical source for all webuildstuffio repos
# Synced fleet-wide by the every-3-day labeling job (never deletes labels).
# Priority is P0-P4 (priority-high etc. are legacy).
# Full doc: .github/LABELS.md in this repo; schema source of truth lives in
# Canonical: .github/setup/master-labels.yaml - keep copies identical.
# Repo specialty labels (area:*, sig-*, product names) are allowed;
# never reuse a generic name below.
# v4.1: themes pwa + mcp promoted from repo specialties (fleet lanes).

version: "4.1"
name: "Fleet Issue Labels"
description: "Standard generic labels: P0-P4, type/status/theme/effort"

labels:
  P0:
    name: "P0"
    color: "#d73a4a"
    description: "Critical: drop everything"
    category: "priority"
  P1:
    name: "P1"
    color: "#ff8c00"
    description: "High priority: this week"
    category: "priority"
  P2:
    name: "P2"
    color: "#fbca04"
    description: "Medium priority: queued work"
    category: "priority"
  P3:
    name: "P3"
    color: "#0e8a16"
    description: "Low priority: real, not soon"
    category: "priority"
  P4:
    name: "P4"
    color: "#808080"
    description: "Backlog: someday/maybe, no commitment"
    category: "priority"
  type-bug:
    name: "type:bug"
    color: "#d73a4a"
    description: "Something is not working"
    category: "type"
  type-feature:
    name: "type:feature"
    color: "#a2eeef"
    description: "New feature or capability"
    category: "type"
  type-refactor:
    name: "type:refactor"
    color: "#c5def5"
    description: "Structure change, no behavior change"
    category: "type"
  type-security:
    name: "type:security"
    color: "#b60205"
    description: "Security issue or hardening"
    category: "type"
  type-ci:
    name: "type:ci"
    color: "#5319e7"
    description: "CI, workflows, build, runners"
    category: "type"
  type-test:
    name: "type:test"
    color: "#0e8a16"
    description: "Tests, coverage, flaky"
    category: "type"
  type-docs:
    name: "type:docs"
    color: "#0075ca"
    description: "Documentation"
    category: "type"
  type-question:
    name: "type:question"
    color: "#d876e3"
    description: "Question or decision needed"
    category: "type"
  type-duplicate:
    name: "type:duplicate"
    color: "#cfd3d7"
    description: "Duplicate of another issue"
    category: "type"
  status-paused:
    name: "status:paused"
    color: "#6e7f80"
    description: "Parked deliberately, no date - not ready"
    category: "status"
  status-delayed:
    name: "status:delayed"
    color: "#c5def5"
    description: "Slipped, still wanted, pushed later"
    category: "status"
  status-blocked:
    name: "status:blocked"
    color: "#b60205"
    description: "Blocked on external factor/dependency"
    category: "status"
  status-needs-info:
    name: "status:needs-info"
    color: "#d876e3"
    description: "Waiting on owner decision/info"
    category: "status"
  seo:
    name: "seo"
    color: "#f9a826"
    description: "SEO / AI-search visibility"
    category: "theme"
  traffic:
    name: "traffic"
    color: "#fb8500"
    description: "Traffic growth / distribution"
    category: "theme"
  analytics:
    name: "analytics"
    color: "#8b5cf6"
    description: "Tracking, measurement, Search Console"
    category: "theme"
  performance:
    name: "performance"
    color: "#1d76db"
    description: "Speed, Web Vitals, bundle, caching"
    category: "theme"
  content:
    name: "content"
    color: "#0075ca"
    description: "Pages, copy, blog, landing content"
    category: "theme"
  revenue:
    name: "revenue"
    color: "#10b981"
    description: "Ads, affiliate, pricing, conversion"
    category: "theme"
  ux:
    name: "ux"
    color: "#d876e3"
    description: "UI, design, accessibility, mobile"
    category: "theme"
  data:
    name: "data"
    color: "#ff6b6b"
    description: "Data pipelines, sources, integrity"
    category: "theme"
  infra:
    name: "infra"
    color: "#5319e7"
    description: "Cloudflare, deploys, runners, domains"
    category: "theme"
  cost:
    name: "cost"
    color: "#e4e669"
    description: "Spend: runners, AI/API, subscriptions"
    category: "theme"
  pwa:
    name: "pwa"
    color: "#5a0fc8"
    description: "PWA installability, manifest, service worker"
    category: "theme"
  mcp:
    name: "mcp"
    color: "#0e7490"
    description: "MCP servers, tools, protocol work"
    category: "theme"
  effort-xs:
    name: "effort:xs"
    color: "#ededed"
    description: "Effort: under 2 hours"
    category: "effort"
  effort-s:
    name: "effort:s"
    color: "#0e8a16"
    description: "Effort: about half a day"
    category: "effort"
  effort-m:
    name: "effort:m"
    color: "#fbca04"
    description: "Effort: 1-2 days"
    category: "effort"
  effort-l:
    name: "effort:l"
    color: "#d93f0b"
    description: "Effort: 3+ days"
    category: "effort"
  effort-xl:
    name: "effort:xl"
    color: "#b60205"
    description: "Effort: epic-sized, split it"
    category: "effort"
  epic:
    name: "epic"
    color: "#5319e7"
    description: "Umbrella epic"
    category: "workflow"
  claude-working:
    name: "🤖 claude-working"
    color: "#f97316"
    description: "Claude AI is currently working on this"
    category: "workflow"
  claude-complete:
    name: "✅ claude-complete"
    color: "#22c55e"
    description: "Claude AI completed this"
    category: "workflow"
  claude-failed:
    name: "❌ claude-failed"
    color: "#ef4444"
    description: "Claude AI failed on this"
    category: "workflow"
  dependencies:
    name: "dependencies"
    color: "#0366d6"
    description: "Pull requests that update dependencies"
    category: "workflow"
  github-actions:
    name: "github-actions"
    color: "#2188ff"
    description: "Changes to GitHub Actions workflows"
    category: "workflow"
  bun:
    name: "bun"
    color: "#fbf0df"
    description: "Bun runtime / package-manager updates"
    category: "workflow"
  monthly-update:
    name: "monthly-update"
    color: "#0e8a16"
    description: "Monthly scheduled dependency updates"
    category: "workflow"
  good-first-issue:
    name: "good first issue"
    color: "#7057ff"
    description: "Good for newcomers"
    category: "workflow"
  help-wanted:
    name: "help wanted"
    color: "#008672"
    description: "Extra attention is needed"
    category: "workflow"
  invalid:
    name: "invalid"
    color: "#e4e669"
    description: "This does not seem right"
    category: "workflow"
  wontfix:
    name: "wontfix"
    color: "#ffffff"
    description: "This will not be worked on"
    category: "workflow"
  needs-triage:
    name: "needs-triage"
    color: "#fbca04"
    description: "Not yet triaged - labeling job takes these first"
    category: "agent"
  claude-ready:
    name: "claude-ready"
    color: "#22c55e"
    description: "Clear self-contained spec - ready for @claude batch"
    category: "agent"
  human-only:
    name: "human-only"
    color: "#8250df"
    description: "Needs owner judgment - do not delegate to agents"
    category: "agent"
  regression:
    name: "regression"
    color: "#b60205"
    description: "Worked before and broke - regression"
    category: "agent"

metadata:
  version: "4.1"
  max_labels_per_issue: 5
  rule: "1 priority + 1-3 type + at most 1 status:* + at most 2 themes"
